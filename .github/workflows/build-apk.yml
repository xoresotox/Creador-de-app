name: Build APK

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar releases

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Sync web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -fv web/index.html web/manifest.webmanifest web/sw.js \
                 web/icon-192.png web/icon-512.png \
                 android/app/src/main/assets/web/
          ls -la android/app/src/main/assets/web/

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (signed with debug key)
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APKs
        id: locate
        run: |
          DEBUG=$(find android/app/build/outputs/apk/debug   -name '*.apk' | head -n1)
          REL=$(find   android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "debug_apk=$DEBUG" >> "$GITHUB_OUTPUT"
          echo "release_apk=$REL"  >> "$GITHUB_OUTPUT"
          ls -la android/app/build/outputs/apk/*/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nutripl-debug-apk
          path: ${{ steps.locate.outputs.debug_apk }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nutripl-release-apk
          path: ${{ steps.locate.outputs.release_apk }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate.outputs.debug_apk }}
            ${{ steps.locate.outputs.release_apk }}
          generate_release_notes: true
